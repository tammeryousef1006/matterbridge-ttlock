name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and how you would use it.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Your setup
      description: Lock model, gateway, ESP32 (yes/no) and Matter controller, if relevant.
